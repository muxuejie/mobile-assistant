<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>个人助理 - 手机版</title>
  <style>
    :root{
      --bg:#0a0810;
      --panel:#16121e;
      --panel2:#22182e;
      --text:#fff5f9;
      --muted:#c4b0c8;
      --line:#402f46;
      --a:#ff4da6;
      --b:#a76cff;
      --c:#3ce8c3;
      --d:#ffd373;
      --ok:#5ef288;
      --bad:#ff6b8a;
      --shadow:0 20px 60px rgba(0,0,0,.4);
    }
    body.theme-light{
      --bg:#f8f6fa;
      --panel:#ffffff;
      --panel2:#f0eaf5;
      --text:#3d2844;
      --muted:#8a7494;
      --line:#e8dfe8;
      --a:#e639a8;
      --b:#8b5cf6;
      --c:#06b6d4;
      --d:#f59e0b;
      --ok:#10b981;
      --bad:#ef4444;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,sans-serif;
      transition:background .3s,color .3s;
      padding-bottom:20px;
    }
    
    /* 顶部 Tab 栏 */
    .tab-bar{
      position:sticky;
      top:0;
      z-index:100;
      display:flex;
      background:var(--panel);
      border-bottom:1px solid var(--line);
      padding:0;
    }
    .tab-btn{
      flex:1;
      min-height:56px;
      border:none;
      background:none;
      color:var(--muted);
      font-size:1rem;
      cursor:pointer;
      transition:.2s;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      border-bottom:3px solid transparent;
      font-weight:500;
    }
    .tab-btn.active{
      color:var(--a);
      border-bottom-color:var(--a);
      background:color-mix(in srgb,var(--a) 8%,transparent);
    }
    .tab-btn:active{
      opacity:.7;
    }
    
    /* 主内容区 */
    .main{
      padding:12px;
      min-width:0;
    }
    .route{display:none}
    .route.active{display:block}
    
    /* 卡片 */
    .card{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
      margin-bottom:12px;
    }
    .card h3{margin:0 0 10px;font-size:1rem}
    .card h4{margin:0 0 10px;font-size:.95rem}
    .card p{margin:0;color:var(--muted);font-size:.85rem}
    
    /* 按钮 */
    .btn{
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--panel2);
      color:var(--text);
      padding:12px 16px;
      font-size:.9rem;
      cursor:pointer;
      transition:.2s;
      min-height:44px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .btn:active{background:color-mix(in srgb,var(--a) 15%,transparent)}
    .btn.primary{
      background:linear-gradient(135deg,var(--a),var(--b));
      color:#fff;
      border:0;
    }
    
    /* 输入框 */
    .field,.text{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--panel2);
      color:var(--text);
      padding:12px;
      outline:0;
      font-size:.9rem;
      min-height:44px;
    }
    .text{min-height:80px;resize:vertical}
    
    /* 网格 */
    .grid2{display:grid;grid-template-columns:1fr;gap:12px}
    .grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    
    /* Toast */
    .toast{
      position:fixed;
      left:12px;
      right:12px;
      bottom:20px;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px 16px;
      box-shadow:var(--shadow);
      opacity:0;
      transform:translateY(10px);
      transition:.3s;
      z-index:1000;
    }
    .toast.show{opacity:1;transform:translateY(0)}
    .toast strong{color:var(--a)}
    
    /* 日历 */
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
    .calendar-day{
      aspect-ratio:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      border-radius:8px;
      font-size:.8rem;
      cursor:pointer;
      transition:.2s;
      position:relative;
      border:1px solid var(--line);
      background:color-mix(in srgb,var(--panel2) 30%,transparent);
      padding:2px;
      min-height:50px;
    }
    .calendar-day:active{border-color:var(--a)}
    .calendar-day.today{
      background:color-mix(in srgb,var(--d) 10%,transparent);
      border-color:var(--d);
    }
    .calendar-day.active{
      background:color-mix(in srgb,var(--a) 25%,transparent);
      border-color:var(--a);
    }
    .calendar-day.important{
      border-color:var(--d);
      box-shadow:0 0 8px color-mix(in srgb,var(--d) 30%,transparent),inset 0 0 10px color-mix(in srgb,var(--d) 10%,transparent);
    }
    .calendar-day.other{color:var(--muted);opacity:.3}
    .calendar-day .day-num{font-size:.85rem;font-weight:600}
    .calendar-day .day-dots{
      display:flex;
      gap:2px;
      position:absolute;
      bottom:4px;
      left:4px;
      right:4px;
      justify-content:flex-start;
      height:6px;
      align-items:center;
    }
    .calendar-day .day-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
    .calendar-day .day-dot.event-dot{background:var(--bad)}
    .calendar-day .day-dot.todo-dot{background:var(--ok)}
    .calendar-day .day-dot.memo-dot{background:var(--c)}
    .calendar-day .day-mood{font-size:.6rem;line-height:1;position:absolute;top:16px;left:50%;transform:translateX(-50%)}
    .calendar-day .day-stars{
      font-size:.4rem;
      color:var(--d);
      position:absolute;
      bottom:2px;
      right:4px;
      line-height:1;
      letter-spacing:-1px;
    }
    .calendar-day .day-star{font-size:.6rem;color:var(--d);position:absolute;top:2px;right:4px}
    .calendar-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
    }
    .calendar-header h3{margin:0;font-size:1rem}
    
    /* 待办 */
    .todo-item{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px;
      border-radius:12px;
      background:var(--panel2);
      margin-bottom:6px;
      border:1px solid var(--line);
      min-height:44px;
    }
    .todo-item.done{opacity:.5}
    .todo-item.done .todo-text{text-decoration:line-through;color:var(--muted)}
    .todo-check{
      width:24px;
      height:24px;
      border-radius:6px;
      border:2px solid var(--line);
      cursor:pointer;
      display:grid;
      place-items:center;
      flex-shrink:0;
    }
    .todo-check.done{background:var(--a);border-color:var(--a)}
    .todo-check.done::after{content:'✓';color:#fff;font-size:.8rem}
    .todo-text{flex:1;font-size:.9rem}
    .todo-delete{color:var(--muted);cursor:pointer;font-size:1rem;padding:8px}
    
    /* 心情选择器 */
    .mood-selector{display:flex;gap:12px;justify-content:center}
    .mood-btn{
      cursor:pointer;
      padding:12px 20px;
      border-radius:16px;
      border:2px solid var(--line);
      background:var(--panel2);
      font-size:2rem;
      transition:all 0.2s;
      min-height:56px;
      min-width:56px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .mood-btn.selected{
      border-color:var(--a);
      background:color-mix(in srgb,var(--a) 15%,transparent);
      transform:scale(1.1);
    }
    
    /* 星星评分 */
    .star-rating{
      display:flex;
      gap:8px;
      justify-content:center;
      padding:8px;
    }
    .star-btn{
      background:none;
      border:none;
      cursor:pointer;
      font-size:2rem;
      color:var(--muted);
      transition:all 0.2s;
      padding:4px 8px;
      min-height:44px;
      min-width:44px;
    }
    
    /* 探店分类卡片 */
    .shop-category-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }
    .shop-category-card{
      border:1px solid var(--line);
      border-radius:16px;
      padding:16px;
      cursor:pointer;
      transition:.2s;
      position:relative;
      overflow:hidden;
      background:color-mix(in srgb,var(--panel2) 50%,transparent);
      min-height:100px;
    }
    .shop-category-card:active{
      transform:scale(0.97);
      border-color:color-mix(in srgb,var(--a) 30%,var(--line));
    }
    .shop-category-card .category-icon{
      font-size:2rem;
      margin-bottom:8px;
      display:block;
    }
    .shop-category-card .category-name{
      font-size:1rem;
      font-weight:600;
      margin-bottom:4px;
    }
    .shop-category-card .category-count{
      font-size:.75rem;
      color:var(--muted);
    }
    .shop-badge{
      position:absolute;
      top:10px;
      right:10px;
      min-width:24px;
      height:24px;
      border-radius:50%;
      background:var(--bad);
      color:#fff;
      font-size:.75rem;
      font-weight:700;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0 6px;
    }
    
    /* 探店任务卡片 */
    .shop-task-card{
      display:flex;
      align-items:center;
      gap:12px;
      padding:12px;
      border-radius:14px;
      border:1px solid var(--line);
      background:color-mix(in srgb,var(--panel2) 40%,transparent);
      transition:.2s;
      min-height:56px;
    }
    .shop-task-card.highlight{
      background:linear-gradient(135deg,color-mix(in srgb,#ff9f43 20%,transparent),color-mix(in srgb,#ff6b6b 10%,transparent));
    }
    .shop-task-card.expired{opacity:.6}
    .shop-task-card .task-checkbox{
      width:24px;
      height:24px;
      border-radius:6px;
      border:2px solid var(--line);
      cursor:pointer;
      display:grid;
      place-items:center;
      flex-shrink:0;
    }
    .shop-task-card .task-checkbox.checked{
      background:var(--ok);
      border-color:var(--ok);
    }
    .shop-task-card .task-checkbox.checked::after{
      content:'✓';
      color:#fff;
      font-size:.8rem;
    }
    .shop-task-card .task-content{flex:1;min-width:0}
    .shop-task-card .task-title{font-weight:600;margin-bottom:2px;font-size:.9rem}
    .shop-task-card .task-meta{
      font-size:.75rem;
      color:var(--muted);
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .shop-task-card .task-actions{
      display:flex;
      gap:6px;
      flex-shrink:0;
    }
    .shop-task-card .task-actions .btn{
      padding:6px 10px;
      font-size:.75rem;
      min-height:32px;
    }
    
    /* 时间线 */
    .timeline-hour{
      display:flex;
      gap:8px;
      padding:6px 0;
      border-bottom:1px dashed color-mix(in srgb,var(--line) 40%,transparent);
    }
    .timeline-hour:last-child{border-bottom:none}
    .timeline-time{
      width:50px;
      text-align:right;
      font-size:.75rem;
      color:var(--muted);
      font-family:monospace;
      flex-shrink:0;
    }
    .timeline-slot{
      flex:1;
      padding:8px 10px;
      border-radius:10px;
      background:color-mix(in srgb,var(--panel2) 30%,transparent);
      min-height:44px;
      position:relative;
    }
    .timeline-slot.has-event{
      background:linear-gradient(135deg,color-mix(in srgb,var(--a) 15%,transparent),color-mix(in srgb,var(--b) 10%,transparent));
    }
    .timeline-slot.lunch-slot{
      background:color-mix(in srgb,var(--ok) 8%,transparent);
      border:1px dashed var(--ok);
    }
    .timeline-slot.dinner-slot{
      background:color-mix(in srgb,var(--d) 8%,transparent);
      border:1px dashed var(--d);
    }
    .timeline-slot .event-title{font-size:.85rem;font-weight:600;margin-bottom:2px}
    .timeline-slot .event-time{font-size:.7rem;color:var(--muted)}
    
    /* 折叠面板 */
    .section-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      cursor:pointer;
      min-height:44px;
    }
    .section-content{padding:12px}
    .section-arrow{
      font-size:.75rem;
      color:var(--muted);
      transition:transform 0.2s;
    }
    
    /* 模态框 */
    .modal-overlay{
      position:fixed;
      top:0;
      left:0;
      right:0;
      bottom:0;
      background:rgba(0,0,0,.6);
      z-index:200;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px;
    }
    .modal-content{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:20px;
      padding:20px;
      width:100%;
      max-height:85vh;
      overflow-y:auto;
    }
    .modal-content h3{margin:0 0 16px;font-size:1.1rem}
    .modal-content .form-group{margin-bottom:14px}
    .modal-content .form-group label{
      display:block;
      font-size:.85rem;
      color:var(--muted);
      margin-bottom:6px;
    }
    .modal-content .form-group input,
    .modal-content .form-group select,
    .modal-content .form-group textarea{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      background:color-mix(in srgb,var(--panel2) 60%,transparent);
      color:var(--text);
      padding:12px;
      outline:0;
      font-size:.9rem;
      min-height:44px;
    }
    .modal-content .form-group textarea{
      min-height:80px;
      resize:vertical;
    }
    .modal-content .modal-actions{
      display:flex;
      gap:12px;
      justify-content:flex-end;
      margin-top:20px;
    }
    .modal-content .modal-actions .btn{
      flex:1;
    }
    
    /* 空状态 */
    .empty-state{
      text-align:center;
      padding:40px 20px;
      color:var(--muted);
    }
    .empty-state .icon{font-size:3rem;margin-bottom:12px}
    
    /* 返回按钮 */
    .back-btn{
      margin-bottom:12px;
    }
    
    /* 操作按钮行 */
    .action-row{
      display:flex;
      gap:8px;
      margin-bottom:12px;
      flex-wrap:wrap;
    }
    .action-row .btn{flex:1;min-width:120px}
    
    /* 周总结 */
    .week-summary{
      display:grid;
      grid-template-columns:repeat(7,1fr);
      gap:4px;
      margin-top:12px;
    }
    .week-day{
      text-align:center;
      padding:6px 2px;
      border-radius:8px;
      background:var(--panel2);
      border:1px solid var(--line);
      font-size:.7rem;
    }
    .week-day .day-name{font-size:.65rem;color:var(--muted);margin-bottom:2px}
    .week-day .star-row{font-size:.6rem;margin-bottom:1px}
    .week-day .mood-row{font-size:.7rem}
    
    /* 图例 */
    .legend{
      margin-top:10px;
      font-size:.7rem;
      color:var(--muted);
      display:flex;
      flex-wrap:wrap;
      gap:12px;
    }
    .legend-item{display:flex;align-items:center;gap:4px}
    .legend-dot{width:6px;height:6px;border-radius:50%}
    
    /* 资产统计 */
    .asset-stats-row{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      margin-bottom:12px;
    }
    .asset-stat-item{
      text-align:center;
      padding:12px 8px;
      border-radius:12px;
      background:var(--panel2);
      border:1px solid var(--line);
      min-height:70px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .asset-stat-value{
      font-size:1rem;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .asset-stat-value.small{font-size:.9rem}
    .asset-stat-label{
      font-size:.7rem;
      color:var(--muted);
      margin-top:4px;
    }
    .asset-stat-label.small{font-size:.65rem}
    .asset-stats-row-small .asset-stat-item{
      padding:10px 6px;
      min-height:60px;
    }
    
    /* 涨跌颜色 */
    .up{color:var(--ok)}
    .down{color:var(--bad)}
    
    /* 行业大盘网格 - 手机端4列 */
    .market-sectors-grid{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }
    .market-sector-item{
      text-align:center;
      padding:10px 6px;
      border-radius:12px;
      background:var(--panel2);
      border:1px solid var(--line);
      min-height:70px;
    }
    .market-sector-item .sector-icon{
      font-size:1.3rem;
      margin-bottom:4px;
    }
    .market-sector-item .sector-name{
      font-size:.75rem;
      font-weight:600;
      margin-bottom:2px;
    }
    .market-sector-item .sector-change{
      font-size:.8rem;
      font-weight:700;
    }
    
    /* 理财平台网格 - 手机端2列 */
    .platform-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
    }
    .platform-card{
      border:1px solid var(--line);
      border-radius:14px;
      padding:12px;
      background:var(--panel2);
    }
    .platform-header{
      display:flex;
      align-items:center;
      gap:8px;
      margin-bottom:10px;
    }
    .platform-icon{font-size:1.3rem}
    .platform-info{flex:1;min-width:0}
    .platform-info h4{
      margin:0;
      font-size:.85rem;
      font-weight:600;
    }
    .platform-total{
      font-size:.7rem;
      color:var(--muted);
      margin-top:2px;
    }
    .platform-assets{
      max-height:150px;
      overflow-y:auto;
    }
    .platform-asset-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:6px 0;
      border-bottom:1px solid var(--line);
    }
    .platform-asset-item:last-child{border-bottom:none}
    .platform-asset-name{
      font-size:.75rem;
      font-weight:600;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      flex:1;
      min-width:0;
      margin-right:8px;
    }
    .platform-asset-amount{
      font-size:.65rem;
      color:var(--muted);
    }
    .platform-asset-change{
      font-size:.7rem;
      font-weight:700;
      flex-shrink:0;
    }
    
    /* 资产列表项 */
    .asset-group{
      margin-bottom:12px;
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
    }
    .asset-group-header{
      display:flex;
      align-items:center;
      gap:8px;
      padding:10px 14px;
      cursor:pointer;
      min-height:48px;
    }
    .asset-group-header .group-icon{font-size:1.2rem}
    .asset-group-header .group-info{flex:1;min-width:0}
    .asset-group-header .group-name{
      font-weight:700;
      font-size:.85rem;
    }
    .asset-group-header .group-meta{
      font-size:.72rem;
      color:var(--muted);
    }
    .asset-group-header .group-profit{
      text-align:right;
    }
    .asset-group-header .group-profit-value{
      font-weight:700;
      font-size:.85rem;
    }
    .asset-group-header .group-profit-label{
      font-size:.65rem;
      color:var(--muted);
    }
    .asset-group-items{
      padding:6px 10px;
    }
    .asset-item{
      display:flex;
      align-items:center;
      gap:10px;
      padding:8px 12px;
      margin-bottom:4px;
      border-radius:10px;
      border:1px solid var(--line);
      background:color-mix(in srgb,var(--panel2) 40%,transparent);
      min-height:52px;
    }
    .asset-item .asset-content{flex:1;min-width:0}
    .asset-item .asset-name{
      font-size:.82rem;
      font-weight:600;
      margin-bottom:2px;
    }
    .asset-item .asset-meta{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      font-size:.72rem;
      color:var(--muted);
    }
    .asset-item .asset-right{
      text-align:right;
      flex-shrink:0;
    }
    .asset-item .asset-profit{
      font-weight:700;
      font-size:.82rem;
    }
    .asset-item .asset-amount{
      font-size:.7rem;
      color:var(--muted);
    }
    .cat-tag{
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:1px 6px;
      border-radius:999px;
      font-size:.65rem;
    }
    .cat-dot{
      width:6px;
      height:6px;
      border-radius:50%;

  <div class="toast" id="toast"><strong>提示</strong><span></span></div>
  
  <script>
  (function() {
    'use strict';
    
    var $ = function(id) { return document.getElementById(id); };
    var qs = function(sel) { return document.querySelector(sel); };
    var qsa = function(sel) { return document.querySelectorAll(sel); };
    var rand = function(a, b) { return Math.random() * (b - a) + a; };
    var randInt = function(a, b) { return Math.floor(rand(a, b + 1)); };
    var fmt = function(n) { return n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
    var todayStr = function() {
      var d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    };
    var loadJSON = function(key, def) { try { return JSON.parse(localStorage.getItem(key)) || def; } catch(e) { return def; } };
    var saveJSON = function(key, val) { localStorage.setItem(key, JSON.stringify(val)); };
    
    var toastTimer = null;
    function tip(title, msg) {
      var t = $('toast');
      if (!t) return;
      t.querySelector('strong').textContent = title || '提示';
      t.querySelector('span').textContent = msg || '';
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { t.classList.remove('show'); }, 2500);
    }
    window.tip = tip;
    
    function initRoutes() {
      qsa('.tab-btn').forEach(function(el) {
        el.addEventListener('click', function(e) {
          e.preventDefault();
          var route = el.getAttribute('data-route');
          qsa('.tab-btn').forEach(function(a) { a.classList.remove('active'); });
          el.classList.add('active');
          qsa('.route').forEach(function(r) { r.classList.remove('active'); });
          var target = $(route);
          if (target) target.classList.add('active');
          if (route === 'schedule') renderSchedule();
          if (route === 'shop') renderShopHome();
          if (route === 'finance') renderFinance();
        });
      });
    }
    
    window.toggleSection = function(id) {
      var el = $(id);
      if (!el) return;
      var visible = el.style.display !== 'none';
      el.style.display = visible ? 'none' : 'block';
      var arrowMap = { todoSection: 'todoArrow', memoSection: 'memoArrow', scheduleSection: 'scheduleArrow' };
      var arrow = $(arrowMap[id]);
      if (arrow) arrow.style.transform = visible ? 'rotate(-90deg)' : 'rotate(0deg)';
    };
    
    window.startVoice = function(target) {
      var inputMap = { schedule: 'scheduleInput' };
      var inputId = inputMap[target];
      if (!inputId || !$(inputId)) { tip('提示', '找不到对应输入框'); return; }
      if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) { tip('提示', '当前浏览器不支持语音识别'); return; }
      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      var recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = false;
      recognition.interimResults = true;
      $(inputId).placeholder = '🎤 正在聆听...';
      recognition.onresult = function(e) {
        var text = '';
        for (var i = e.resultIndex; i < e.results.length; i++) { text += e.results[i][0].transcript; }
        $(inputId).value = text;
      };
      recognition.onend = function() { $(inputId).placeholder = '语音输入完成'; tip('语音', '识别完成'); };
      recognition.onerror = function() { $(inputId).placeholder = '语音识别失败'; tip('语音', '识别失败'); };
      recognition.start();
    };
    
    function escapeHtml(text) {
      if (!text) return '';
      var map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
    }
    
    /* ========================================
       日程管理模块
       ======================================== */
    var scheduleData = loadJSON('scheduleData', {});
    var globalTodos = loadJSON('globalTodos', []);
    var currentYear, currentMonthNum, selectedDate;
    var clickTimer = null;
    
    function initScheduleState() {
      var now = new Date();
      currentYear = now.getFullYear();
      currentMonthNum = now.getMonth();
      selectedDate = todayStr();
      if (Object.keys(scheduleData).length === 0) generateSampleScheduleData();
      if (globalTodos.length === 0) {
        globalTodos = [
          { text: '整理工作周报', done: false },
          { text: '预约体检', done: false },
          { text: '学习英语30分钟', done: false },
          { text: '复盘本周计划', done: false }
        ];
        saveJSON('globalTodos', globalTodos);
      }
    }
    
    function generateSampleScheduleData() {
      var schedules = {
        '08:00': { title: '晨间运动', type: 'health' },
        '09:00': { title: '工作开始', type: 'work' },
        '10:00': { title: '项目会议', type: 'meeting' },
        '12:00': { title: '午餐', type: 'meal' },
        '14:00': { title: '深度工作', type: 'work' },
        '15:30': { title: '团队同步', type: 'meeting' },
        '17:00': { title: '邮件处理', type: 'work' },
        '18:30': { title: '晚餐', type: 'meal' },
        '20:00': { title: '阅读学习', type: 'study' },
        '22:00': { title: '准备休息', type: 'health' }
      };
      var now = new Date();
      for (var i = -3; i <= 10; i++) {
        var d = new Date(now); d.setDate(d.getDate() + i);
        var key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        scheduleData[key] = {
          todos: [
            { text: '完成项目文档', done: Math.random() > 0.5 },
            { text: '回复重要邮件', done: Math.random() > 0.5 },
            { text: '提交代码审查', done: Math.random() > 0.7 }
          ],
          memo: i === 0 ? '记得带伞出门' : '',
          schedule: JSON.parse(JSON.stringify(schedules)),
          stars: randInt(2, 5),
          mood: ['happy', 'neutral', 'sad'][randInt(0, 2)],
          important: Math.random() > 0.7
        };
      }
      saveJSON('scheduleData', scheduleData);
    }
    
    function renderSchedule() {
      renderMiniCalendar();
      renderGlobalTodos();
      renderSelectedDatePanel();
      updateStarRating();
      updateMoodSelector();
    }
    
    function renderMiniCalendar() {
      var container = $('miniCalendar');
      var monthLabel = $('currentMonth');
      if (!container) return;
      if (monthLabel) monthLabel.textContent = currentYear + '年' + (currentMonthNum + 1) + '月';
      var firstDay = new Date(currentYear, currentMonthNum, 1).getDay();
      var daysInMonth = new Date(currentYear, currentMonthNum + 1, 0).getDate();
      var tStr = todayStr();
      var html = '';
      var weekHeaders = ['日', '一', '二', '三', '四', '五', '六'];
      for (var w = 0; w < weekHeaders.length; w++) {
        html += '<div style="text-align:center;font-size:.7rem;color:var(--muted);padding:4px 0;">' + weekHeaders[w] + '</div>';
      }
      var prevMonthDays = new Date(currentYear, currentMonthNum, 0).getDate();
      for (var p = firstDay - 1; p >= 0; p--) {
        html += '<div class="calendar-day other"><span class="day-num">' + (prevMonthDays - p) + '</span></div>';
      }
      for (var d = 1; d <= daysInMonth; d++) {
        var dateStr = currentYear + '-' + String(currentMonthNum+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        var data = scheduleData[dateStr];
        var isToday = dateStr === tStr;
        var isActive = dateStr === selectedDate;
        var isImportant = data && data.important;
        var cls = 'calendar-day';
        if (isToday) cls += ' today';
        if (isActive) cls += ' active';
        if (isImportant) cls += ' important';
        var dotsHtml = '';
        var moodHtml = '';
        var starsHtml = '';
        if (data) {
          if (data.schedule && Object.keys(data.schedule).length > 0) dotsHtml += '<span class="day-dot event-dot"></span>';
          if (data.todos && data.todos.length > 0) dotsHtml += '<span class="day-dot todo-dot"></span>';
          if (data.memo) dotsHtml += '<span class="day-dot memo-dot"></span>';
          var moodEmojis = { happy: '😄', neutral: '😐', sad: '😢' };
          if (data.mood && moodEmojis[data.mood]) moodHtml = '<span class="day-mood">' + moodEmojis[data.mood] + '</span>';
          if (data.stars && data.stars > 0) {
            var starChars = '';
            for (var si = 0; si < data.stars; si++) starChars += '★';
            starsHtml = '<span class="day-stars">' + starChars + '</span>';
          }
        }
        var starHtml = isImportant 
          ? '<span class="day-star" onclick="event.stopPropagation();window.toggleImportant(\'' + dateStr + '\')" style="cursor:pointer;">⭐</span>' 
          : '';
        html += '<div class="' + cls + '" onclick="window.handleCalendarClick(\'' + dateStr + '\')" ondblclick="window.handleCalendarDblClick(\'' + dateStr + '\')" title="' + dateStr + '">';
        html += starHtml + '<span class="day-num">' + d + '</span>';
        if (moodHtml) html += moodHtml;
        if (starsHtml) html += starsHtml;
        if (dotsHtml) html += '<div class="day-dots">' + dotsHtml + '</div>';
        html += '</div>';
      }
      var totalCells = firstDay + daysInMonth;
      var remaining = (7 - totalCells % 7) % 7;
      for (var n = 1; n <= remaining; n++) {
        html += '<div class="calendar-day other"><span class="day-num">' + n + '</span></div>';
      }
      container.innerHTML = html;
    }

        clickTimer = null;

    function renderSelectedDatePanel() {
      var dateLabel = $('selectedDateStr');
      var todoCountEl = $('todoCount');
      var todoList = $('dateTodoList');
      var scoreDate = $('scoreDateDisplay');
      if (dateLabel) dateLabel.textContent = selectedDate;
      if (scoreDate) scoreDate.textContent = selectedDate;
      var data = scheduleData[selectedDate] || { todos: [], memo: '', schedule: {}, stars: 0, mood: '' };
      scheduleData[selectedDate] = data;
      if (todoCountEl) todoCountEl.textContent = (data.todos || []).length + '项';
      if (todoList) {
        todoList.innerHTML = (data.todos || []).map(function(todo, i) {
          return '<div class="todo-item ' + (todo.done ? 'done' : '') + '">'
            + '<div class="todo-check ' + (todo.done ? 'done' : '') + '" onclick="window.toggleDateTodo(' + i + ')"></div>'

    function renderTimeline(schedule) {
      var container = $('scheduleSection');
      if (!container) return;
      var hours = ['07:00','08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00','19:00','20:00','21:00','22:00'];
      var html = '';
      hours.forEach(function(time) {
        var event = schedule[time];
        var isLunch = time >= '12:00' && time < '13:00';
        var isDinner = time >= '18:00' && time < '19:00';
        var slotClass = 'timeline-slot';
        if (isLunch) slotClass += ' lunch-slot';
        if (isDinner) slotClass += ' dinner-slot';
        if (event) slotClass += ' has-event';
        html += '<div class="timeline-hour"><div class="timeline-time">' + time + '</div><div class="' + slotClass + '">';
        if (event) { 
          html += '<div class="event-card"><div class="event-title">' + escapeHtml(event.title) + '</div><div class="event-time">' + time + ' · ' + (event.type || '其他') + '</div></div>'; 
        }
        html += '</div></div>';
      });
      container.innerHTML = html;
    }

    window.importSchedule = function() {
      var input = $('scheduleInput');
      if (!input || !input.value.trim()) { tip('提示', '请输入日程内容'); return; }
      var text = input.value.trim();
      var timeMatch = text.match(/(\d{1,2})[点时:：](\d{0,2})?\s*(.+)/);
      if (timeMatch) {
        var hour = parseInt(timeMatch[1]);
        var min = timeMatch[2] ? parseInt(timeMatch[2]) : 0;
        var title = timeMatch[3].trim();
        var timeStr = String(hour).padStart(2,'0') + ':' + String(min).padStart(2,'0');
        if (!scheduleData[selectedDate]) scheduleData[selectedDate] = { todos: [], memo: '', schedule: {}, stars: 0, mood: '' };
        scheduleData[selectedDate].schedule[timeStr] = { title: title, type: 'voice' };
        saveJSON('scheduleData', scheduleData);
        renderSelectedDatePanel();
        renderMiniCalendar();
        tip('日程', '已添加：' + timeStr + ' ' + title);
      } else {
        if (!scheduleData[selectedDate]) scheduleData[selectedDate] = { todos: [], memo: '', schedule: {}, stars: 0, mood: '' };
        scheduleData[selectedDate].todos.push({ text: text, done: false });
        saveJSON('scheduleData', scheduleData);
        renderSelectedDatePanel();
        tip('待办', '已添加待办：' + text);
      }

    window.copyScheduleToAllDates = function() {

      var daysInMonth = new Date(currentYear, currentMonthNum + 1, 0).getDate();
      var count = 0;
      for (var d = 1; d <= daysInMonth; d++) {
        var dateStr = currentYear + '-' + String(currentMonthNum+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        if (!scheduleData[dateStr]) scheduleData[dateStr] = { todos: [], memo: '', schedule: {}, stars: 0, mood: '' };
        scheduleData[dateStr].schedule = JSON.parse(JSON.stringify(sourceData.schedule));
        count++;
      }
      saveJSON('scheduleData', scheduleData);
      renderMiniCalendar();
      tip('日程', '已复制到本月 ' + count + ' 天');
    };

    function renderShopDeadlineReminder() {
      var container = $('shopDeadlineReminder');
      if (!container) return;
      var allTasks = [];
      (shopData.categories || []).forEach(function(cat) {
        (cat.tasks || []).forEach(function(task) {
          if (task.status === 'todo') {
            allTasks.push({ 
              id: task.id, 
              title: task.title, 
              deadline: task.deadline, 
              priority: task.priority, 
              notes: task.notes, 
              categoryName: cat.name, 
              categoryIcon: cat.icon 
            });
          }
        });
      });
      allTasks.sort(function(a, b) { return (a.deadline || '9999') > (b.deadline || '9999') ? 1 : -1; });
      var upcoming = allTasks.slice(0, 5);
      if (upcoming.length === 0) { 
        container.innerHTML = '<p style="color:var(--muted);font-size:.85rem;text-align:center;padding:20px;">暂无待处理任务</p>'; 
        return; 
      }
      container.innerHTML = upcoming.map(function(t) {
        var isExpired = t.deadline && t.deadline < todayStr();
        var daysLeft = t.deadline ? Math.ceil((new Date(t.deadline) - new Date()) / 86400000) : null;
        var urgency = isExpired 
          ? '<span style="color:var(--bad);font-weight:700;">已过期</span>' 
          : daysLeft !== null && daysLeft <= 3 
            ? '<span style="color:var(--d);font-weight:700;">剩' + daysLeft + '天</span>' 
            : daysLeft !== null 
              ? '<span style="color:var(--muted);">剩' + daysLeft + '天</span>' 
              : '';
        return '<div class="shop-task-card ' + (isExpired ? 'expired' : '') + '">'
          + '<div class="task-checkbox" onclick="event.stopPropagation()"></div>'
          + '<div class="task-content"><div class="task-title">' + t.categoryIcon + ' ' + escapeHtml(t.title) + '</div>'
          + '<div class="task-meta"><span>' + escapeHtml(t.categoryName) + '</span><span>截止：' + (t.deadline || '无') + '</span>' 
          + (urgency ? '<span>' + urgency + '</span>' : '') + '</div></div></div>';
      }).join('');
    }

      if (sel) sel.value = preSelected;
    };
    
    window.confirmAddShopTask = function() {
      var catId = $('shopTaskCategory') ? $('shopTaskCategory').value : '';
      var title = $('shopTaskTitle') ? $('shopTaskTitle').value.trim() : '';
      var deadline = $('shopTaskDeadline') ? $('shopTaskDeadline').value : '';
      var priority = $('shopTaskPriority') ? $('shopTaskPriority').value : 'medium';
      var notes = $('shopTaskNotes') ? $('shopTaskNotes').value.trim() : '';
      if (!title) { tip('提示', '请输入任务名称'); return; }
      var cat = (shopData.categories || []).find(function(c) { return c.id === catId; });
      if (!cat) { tip('提示', '分类不存在'); return; }
      cat.tasks.push({ id: 't' + Date.now(), title: title, deadline: deadline, status: 'todo', priority: priority, notes: notes });
      saveJSON('shopData', shopData);
      var overlay = document.querySelector('.modal-overlay');
      if (overlay) overlay.remove();
      if (shopCurrentCategory === catId) { 
        renderShopTasks(cat); 
        renderShopArchivedTasks(cat); 
      }
      renderShopHome();
      if (shopCurrentCategory) openShopCategory(shopCurrentCategory);
      tip('探店', '任务添加成功');
    };
    
    window.showAddCategoryModal = function() {
      var html = '<div class="modal-overlay" onclick="if(event.target===this)this.remove()">'
        + '<div class="modal-content"><h3>新增探店分类</h3>'
        + '<div class="form-group"><label>图标 (emoji)</label><input id="shopCatIcon" placeholder="例如: ☕" maxlength="4"></div>'
        + '<div class="form-group"><label>分类名称</label><input id="shopCatName" placeholder="例如: 咖啡茶饮"></div>'
        + '<div class="modal-actions"><button class="btn" onclick="this.closest(\'.modal-overlay\').remove()">取消</button>'
        + '<button class="btn primary" onclick="window.confirmAddShopCategory()">创建</button></div></div></div>';
      document.body.insertAdjacentHTML('beforeend', html);
    };
    
    window.confirmAddShopCategory = function() {
      var icon = $('shopCatIcon') ? $('shopCatIcon').value.trim() || '📁' : '📁';
      var name = $('shopCatName') ? $('shopCatName').value.trim() : '';
      if (!name) { tip('提示', '请输入分类名称'); return; }
      shopData.categories.push({ id: 'cat' + Date.now(), name: name, icon: icon, tasks: [] });
      saveJSON('shopData', shopData);
      var overlay = document.querySelector('.modal-overlay');
      if (overlay) overlay.remove();
      renderShopHome();
      if (shopCurrentCategory) openShopCategory(shopCurrentCategory);
      tip('探店', '分类 "' + name + '" 创建成功');
    };
    
    window.openShopCategory = window.openShopCategory;
    
    /* ========================================
       资产管理模块（简洁版：渠道 + 金额 + 饼图）
       ======================================== */
    var CHANNEL_COLORS = ['#ff6b9d', '#a78bfa', '#60a5fa', '#34d399', '#fbbf24', '#f472b6', '#22d3ee', '#fb923c', '#a3e635', '#e879f9'];

    var assetData = loadJSON('assetData', null);

    function initAssetData() {
      if (!assetData || !assetData.channels || !Array.isArray(assetData.channels) || typeof assetData.channels[0] !== 'object') {
        assetData = {
          channels: [
            { id: 'ch1', name: '支付宝', amount: 45000, color: '#1677ff' },
            { id: 'ch2', name: '理财通', amount: 20000, color: '#07c160' },
            { id: 'ch3', name: '微众银行', amount: 180000, color: '#ff6b00' },
            { id: 'ch4', name: '京东理财', amount: 15000, color: '#e1251b' }
          ]
        };
        saveJSON('assetData', assetData);
      }
      (assetData.channels || []).forEach(function(ch, i) {
        if (!ch.id) ch.id = 'ch' + Date.now() + '_' + i;
        if (!ch.color) ch.color = CHANNEL_COLORS[i % CHANNEL_COLORS.length];
        if (!ch.amount) ch.amount = 0;
      });
      saveJSON('assetData', assetData);
    }

    function renderFinance() {
      renderTotalAssets();
      renderChannelList();
      renderPieChart();
    }

    function renderTotalAssets() {
      var total = (assetData.channels || []).reduce(function(s, ch) { return s + (ch.amount || 0); }, 0);
      var el = $('totalAssets');
      if (el) el.textContent = '¥' + fmt(total);
    }

    function renderChannelList() {
      var container = $('channelList');
      if (!container) return;
      var channels = assetData.channels || [];
      var total = channels.reduce(function(s, ch) { return s + (ch.amount || 0); }, 0);
      if (channels.length === 0) {
        container.innerHTML = '<p style="color:var(--muted);font-size:.85rem;text-align:center;padding:24px 0;">暂无渠道，点击右上角添加</p>';
        return;
      }
      var html = channels.map(function(ch, i) {
        var pct = total > 0 ? ((ch.amount || 0) / total * 100).toFixed(1) : 0;
        return '<div class="channel-item">'
          + '<div class="channel-left">'
          + '<span class="channel-dot" style="background:' + ch.color + ';"></span>'
          + '<span class="channel-name">' + escapeHtml(ch.name) + '</span>'
          + '</div>'
          + '<div class="channel-right">'
          + '<span class="channel-amount">¥' + fmt(ch.amount || 0) + '</span>'
          + '<span class="channel-pct">' + pct + '%</span>'
          + '<button class="btn-icon" onclick="window.editChannel(' + i + ')" title="编辑">✏️</button>'
          + '<button class="btn-icon" onclick="window.deleteChannel(' + i + ')" title="删除">🗑️</button>'
          + '</div>'
          + '</div>'
          + '<div class="channel-bar-bg"><div class="channel-bar" style="width:' + pct + '%;background:' + ch.color + ';"></div></div>';
      }).join('');
      container.innerHTML = html;
    }

    function renderPieChart() {
      var el = $('assetPieChart');
      if (!el || typeof echarts === 'undefined') return;
      var chart;
      try { chart = echarts.init(el); } catch(e) { return; }
      var channels = assetData.channels || [];
      var data = channels.map(function(ch) { return { name: ch.name, value: ch.amount || 0, itemStyle: { color: ch.color } }; });
      chart.setOption({
        tooltip: {
          trigger: 'item',
          formatter: '{b}: ¥{c} ({d}%)',
          backgroundColor: 'rgba(22,18,30,0.95)',
          borderColor: '#402f46',
          textStyle: { color: '#e8d5ed', fontSize: 12 }
        },
        legend: {
          bottom: 0,
          textStyle: { color: '#c4b0c8', fontSize: 11 },
          itemWidth: 10,
          itemHeight: 10,
          icon: 'circle'
        },
        series: [{
          type: 'pie',
          radius: ['45%', '72%'],
          center: ['50%', '42%'],
          avoidLabelOverlap: true,
          itemStyle: {
            borderRadius: 10,
            borderColor: '#16121e',
            borderWidth: 3
          },
          label: {
            show: true,
            color: '#c4b0c8',
            fontSize: 11,
            formatter: '{d}%'
          },
          labelLine: {
            length: 8,
            length2: 6,
            lineStyle: { color: '#402f46' }
          },
          data: data
        }],
        animationType: 'scale',
        animationEasing: 'elasticOut',
        animationDuration: 800
      });
    }

    function closeAllModals() {
      var overlays = document.querySelectorAll('.modal-overlay');
      overlays.forEach(function(o) { o.remove(); });
    }
    window.closeAllModals = closeAllModals;

    window.showChannelModal = function() {
      closeAllModals();
      var colorPicker = CHANNEL_COLORS.map(function(col, idx) {
        return '<span class="color-swatch' + (idx === 0 ? ' selected' : '') + '" data-color="' + col + '" onclick="window.selectChannelColor(this)" style="width:32px;height:32px;border-radius:10px;display:inline-block;background:' + col + ';cursor:pointer;border:2px solid transparent;transition:.2s;"></span>';
      }).join('');
      var html = '<div class="modal-overlay" onclick="if(event.target===this)this.remove()">'
        + '<div class="modal-content"><h3>➕ 添加渠道</h3>'
        + '<div class="form-group"><label>渠道名称</label><input class="field" id="newChannelName" placeholder="例如：招商银行、股票账户"></div>'
        + '<div class="form-group"><label>金额 (¥)</label><input class="field" id="newChannelAmount" type="number" placeholder="持仓金额" value="0"></div>'
        + '<div class="form-group"><label>选择颜色</label><div id="channelColorPicker" style="display:flex;gap:8px;flex-wrap:wrap;">' + colorPicker + '</div></div>'
        + '<div class="modal-actions"><button class="btn" onclick="window.closeAllModals()">取消</button>'
        + '<button class="btn primary" onclick="window.addChannel()">确认添加</button></div></div></div>';
      document.body.insertAdjacentHTML('beforeend', html);
      window._selectedChannelColor = CHANNEL_COLORS[0];
    };

    window.selectChannelColor = function(el) {
      document.querySelectorAll('#channelColorPicker .color-swatch').forEach(function(s) { s.style.border = '2px solid transparent'; s.classList.remove('selected'); });
      el.style.border = '2px solid #fff';
      el.classList.add('selected');
      window._selectedChannelColor = el.getAttribute('data-color');
    };

    window.addChannel = function() {
      var nameEl = $('newChannelName');
      var amountEl = $('newChannelAmount');
      var name = nameEl ? nameEl.value.trim() : '';
      var amount = amountEl ? parseFloat(amountEl.value) || 0 : 0;
      if (!name) { tip('提示', '请输入渠道名称'); return; }
      assetData.channels.push({
        id: 'ch' + Date.now(),
        name: name,
        amount: amount,
        color: window._selectedChannelColor || CHANNEL_COLORS[Math.floor(Math.random() * CHANNEL_COLORS.length)]
      });
      saveJSON('assetData', assetData);
      closeAllModals();
      renderFinance();
      tip('资产', '添加成功：' + name);
    };

    window.editChannel = function(i) {
      var ch = assetData.channels[i];
      if (!ch) return;
      closeAllModals();
      var colorPicker = CHANNEL_COLORS.map(function(col) {
        return '<span class="color-swatch' + (col === ch.color ? ' selected' : '') + '" data-color="' + col + '" onclick="window.selectChannelColor(this)" style="width:32px;height:32px;border-radius:10px;display:inline-block;background:' + col + ';cursor:pointer;border:2px solid ' + (col === ch.color ? '#fff' : 'transparent') + ';transition:.2s;"></span>';
      }).join('');
      var html = '<div class="modal-overlay" onclick="if(event.target===this)this.remove()">'
        + '<div class="modal-content"><h3>✏️ 编辑渠道</h3>'
        + '<div class="form-group"><label>渠道名称</label><input class="field" id="editChannelName" value="' + escapeHtml(ch.name) + '"></div>'
        + '<div class="form-group"><label>金额 (¥)</label><input class="field" id="editChannelAmount" type="number" value="' + (ch.amount || 0) + '"></div>'
        + '<div class="form-group"><label>选择颜色</label><div id="channelColorPicker" style="display:flex;gap:8px;flex-wrap:wrap;">' + colorPicker + '</div></div>'
        + '<div class="modal-actions"><button class="btn" onclick="window.closeAllModals()">取消</button>'
        + '<button class="btn primary" onclick="window.confirmEditChannel(' + i + ')">保存</button></div></div></div>';
      document.body.insertAdjacentHTML('beforeend', html);
      window._selectedChannelColor = ch.color;
    };

    window.confirmEditChannel = function(i) {
      var nameEl = $('editChannelName');
      var amountEl = $('editChannelAmount');
      var name = nameEl ? nameEl.value.trim() : '';
      var amount = amountEl ? parseFloat(amountEl.value) || 0 : 0;
      if (!name) { tip('提示', '请输入渠道名称'); return; }
      assetData.channels[i].name = name;
      assetData.channels[i].amount = amount;
      assetData.channels[i].color = window._selectedChannelColor || assetData.channels[i].color;
      saveJSON('assetData', assetData);
      closeAllModals();
      renderFinance();
      tip('资产', '保存成功');
    };

    window.deleteChannel = function(i) {
      var ch = assetData.channels[i];
      if (!ch) return;
      if (!confirm('确定删除渠道 "' + ch.name + '" 吗？')) return;
      assetData.channels.splice(i, 1);
      saveJSON('assetData', assetData);
      renderFinance();
      tip('资产', '已删除：' + ch.name);
    };
    
    /* ===== 初始化 ===== */
    function init() {
      var tipEl = $('jsLoadedTip');
      if (tipEl) { tipEl.style.display = 'block'; setTimeout(function() { if (tipEl) tipEl.style.display = 'none'; }, 2000); }
      initRoutes();
      initScheduleState();
      initShopData();
      initAssetData();
      renderSchedule();
      var todoInput = $('globalTodoInput');
      if (todoInput) todoInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') window.addGlobalTodo(); });
      var dateInput = $('dateTodoInput');
      if (dateInput) dateInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') window.addDateTodo(); });
      var schedInput = $('scheduleInput');
      if (schedInput) schedInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') window.importSchedule(); });
      console.log('个人助理手机版 JS 初始化完成');
    }
    
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); }
    else { init(); }
    
  })();
  </script>
</body>
</html>
